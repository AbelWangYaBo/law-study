[project]
name = "law-study"
version = "0.1.0"
description = "法规学习系统：术语字典、分词拼句背诵、AI 解读、法规知识图谱"
authors = [
    { name = "abel", email = "1417611676@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "alembic",
    "jieba",
    "openai",
    "beautifulsoup4",
    "pyyaml",
    "pydantic-settings",
    "httpx",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
